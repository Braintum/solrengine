name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gates. Everything here must pass before the slower matrix runs, so a
  # missing docblock does not burn twenty minutes of matrix time.
  static:
    name: Standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Versions agree across header, constant and readme
        run: php bin/check-version.php

      # The same rule Plugin Check enforces, answered in a second here so a
      # missing guard fails before the slower matrix starts.
      - name: Shipped files refuse direct access
        run: php bin/check-direct-access.php

      # Generated from the docblocks above each hook, so it cannot drift from
      # them. This step also fails when a hook has no docblock, no @since, or
      # documents a different number of parameters than it passes — hooks are
      # public API from 1.0, and an undocumented one has no contract.
      - name: Hook reference is current and hooks are documented
        run: php bin/generate-hooks.php --check

      - name: Coding standards
        run: vendor/bin/phpcs --report=full

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Dependency vulnerabilities
        run: composer audit

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint:js

      - name: Lint styles
        run: npm run lint:css

      - name: Build
        run: npm run build

      - name: Committed build output is current
        # assets/build is committed because WordPress.org ships a zip rather
        # than running a build. If a rebuild changes it, somebody edited the
        # source without rebuilding and the release would ship stale assets.
        run: git diff --exit-code -- assets/build

  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported range, per ADR-011.
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          composer-options: --ignore-platform-req=php+

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported combination.
          - php: '7.4'
            wordpress: '6.5'
          # Current.
          - php: '8.3'
            wordpress: 'latest'
          # Next, allowed to fail so a WordPress beta does not block a release.
          - php: '8.3'
            wordpress: 'trunk'
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          composer-options: --ignore-platform-req=php+

      - name: Install the WordPress test library
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wordpress }}

      - name: Integration tests
        env:
          SOLRENGINE_TEST_SUITE: integration
        run: vendor/bin/phpunit --testsuite integration

  # The same integration suite with WooCommerce loaded. The plain jobs above
  # prove the plugin works without it, and skip the product tests to do so;
  # this one proves the product mapping against real WooCommerce CRUD, and
  # fails on any skipped test, so a product test can never pass by not running.
  # Both WooCommerce lines docs/compatibility.md promises: the current stable
  # release and the previous minor, resolved from the plugin directory on every
  # run by bin/woocommerce-version.php.
  woocommerce:
    name: Integration (WooCommerce ${{ matrix.woocommerce }})
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        woocommerce: ['latest', 'previous']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Install the WordPress test library
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest

      - name: Install WooCommerce
        run: |
          version="$(php bin/woocommerce-version.php ${{ matrix.woocommerce }})"
          echo "WooCommerce ${version}"
          curl -sSfL "https://downloads.wordpress.org/plugin/woocommerce.${version}.zip" -o "$RUNNER_TEMP/woocommerce.zip"
          unzip -q "$RUNNER_TEMP/woocommerce.zip" -d "$RUNNER_TEMP"
          echo "SOLRENGINE_TEST_WOOCOMMERCE=$RUNNER_TEMP/woocommerce" >> "$GITHUB_ENV"

      - name: Integration tests with WooCommerce
        env:
          SOLRENGINE_TEST_SUITE: integration
        run: vendor/bin/phpunit --testsuite integration --fail-on-skipped

  # Solr-backed tests. Separate because they need a container and are the
  # slowest thing here. Both supported Solr lines are exercised: 10.x is the
  # recommended target, 9.10 the last supported 9.x. See ADR-011.
  backend:
    name: Backend (Solr ${{ matrix.solr }})
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        solr: ['9.10', '10']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Install the WordPress test library
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest

      # Started as a step rather than as a service container, because the core
      # has to exist before the suite runs and a service container cannot be
      # given a command. A stock Solr starts with no cores at all: against one,
      # every test in the suite skips, and a suite that skips silently looks
      # exactly like a suite that passed.
      - name: Start Solr with a collection
        run: |
          docker run -d --name solr -p 8983:8983 \
            solr:${{ matrix.solr }} solr-precreate wordpress

          for attempt in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8983/solr/wordpress/admin/ping" > /dev/null; then
              echo "Solr is up."
              exit 0
            fi
            sleep 2
          done

          echo "Solr did not become ready."
          docker logs solr
          exit 1

      - name: Backend tests
        env:
          SOLRENGINE_TEST_SUITE: backend
          SOLRENGINE_TEST_SOLR_URL: http://127.0.0.1:8983/solr
        run: vendor/bin/phpunit --testsuite backend

  # Directory compliance. Blocking, per plan Appendix A item A17: WordPress.org
  # runs the same scanner on every submission and automated security analysis
  # on every release, so a finding here stops a release rather than merely
  # embarrassing us.
  #
  # Runs against the built package, never the repository, because the package
  # is what the reviewers scan: .distignore decides what ships, and a file that
  # only exists in git is not their concern.
  #
  # No ignore-codes. The two codes this job used to suppress are gone at the
  # source: instant.php (missing_direct_file_access_protection) was removed for
  # the first release, and Support/Container.php scopes its ExceptionNotEscaped
  # exemption to its own two throws with a justified phpcs:disable. A blanket
  # suppression here would also hide every future finding with the same code.
  #
  # Strict: a warning fails the job as well. The package scans clean, so any
  # warning is new and gets a fix or a written disposition before it ships.
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The script installs production dependencies into the package from
      # composer.lock itself, so no composer install here. It builds the zip,
      # its checksum and manifest, and unpacks the zip again to verify it.
      - name: Build the distributable
        run: |
          npm ci
          npm run build
          bash bin/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: solrengine-package
          path: |
            build/solrengine-*.zip
            build/solrengine-*.zip.sha256
            build/solrengine-*.manifest.txt
          if-no-files-found: error

      - uses: wordpress/plugin-check-action@v1
        id: plugin-check
        with:
          build-dir: ./build/solrengine
          slug: solrengine
          strict: true

      # The action's own gate is its exit status, and the audit found the
      # Plugin Check CLI exiting 0 while reporting errors. So the uploaded
      # results are read again here: an ERROR in them fails the job whatever
      # the step above returned, and the counts land in the run summary. Any
      # finding fails, warnings included, to match `strict` above.
      - name: Gate on the reported findings
        if: always()
        env:
          RESULTS: ${{ runner.temp }}/plugin-check-results.txt
        run: |
          # Missing means the scan never ran. Empty is a clean scan.
          if [ ! -f "$RESULTS" ]; then
            echo "::error::Plugin Check produced no results file."
            exit 1
          fi

          php -r '
            $errors = 0; $warnings = 0; $rows = array();
            foreach ( file( getenv( "RESULTS" ), FILE_IGNORE_NEW_LINES ) as $line ) {
              if ( 0 === strpos( $line, "FILE: " ) ) { $file = substr( $line, 6 ); continue; }
              $items = json_decode( $line, true );
              if ( ! is_array( $items ) ) { continue; }
              foreach ( $items as $item ) {
                if ( ! is_array( $item ) || ! isset( $item["type"] ) ) { continue; }
                "ERROR" === $item["type"] ? $errors++ : $warnings++;
                $rows[] = sprintf( "| %s | %s:%d | `%s` |", $item["type"], $file, $item["line"] ?? 0, $item["code"] ?? "" );
              }
            }
            $summary = "## Plugin Check\n\n**{$errors} errors, {$warnings} warnings**\n\n";
            if ( $rows ) { $summary .= "| Type | Location | Code |\n| --- | --- | --- |\n" . implode( "\n", $rows ) . "\n"; }
            file_put_contents( getenv( "GITHUB_STEP_SUMMARY" ), $summary, FILE_APPEND );
            echo "Plugin Check: {$errors} errors, {$warnings} warnings\n";
            exit( $errors + $warnings > 0 ? 1 : 0 );
          '
