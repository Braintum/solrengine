name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gates. Everything here must pass before the slower matrix runs, so a
  # missing docblock does not burn twenty minutes of matrix time.
  static:
    name: Standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Versions agree across header, constant and readme
        run: php bin/check-version.php

      - name: Coding standards
        run: vendor/bin/phpcs --report=full

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Dependency vulnerabilities
        run: composer audit

  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported range, per ADR-011.
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          composer-options: --ignore-platform-req=php+

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported combination.
          - php: '7.4'
            wordpress: '6.5'
          # Current.
          - php: '8.3'
            wordpress: 'latest'
          # Next, allowed to fail so a WordPress beta does not block a release.
          - php: '8.3'
            wordpress: 'trunk'
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          composer-options: --ignore-platform-req=php+

      - name: Install the WordPress test library
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wordpress }}

      - name: Integration tests
        env:
          SOLRENGINE_TEST_SUITE: integration
        run: vendor/bin/phpunit --testsuite integration

  # Solr-backed tests. Separate because they need a container and are the
  # slowest thing here. Both supported Solr lines are exercised: 10.x is the
  # recommended target, 9.10 the last supported 9.x. See ADR-011.
  backend:
    name: Backend (Solr ${{ matrix.solr }})
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        solr: ['9.10', '10']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      solr:
        image: solr:${{ matrix.solr }}
        ports: ['8983:8983']
        options: >-
          --health-cmd="curl -sf http://localhost:8983/solr/admin/info/system || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Install the WordPress test library
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest

      - name: Backend tests
        env:
          SOLRENGINE_TEST_SUITE: backend
          SOLRENGINE_TEST_SOLR_URL: http://127.0.0.1:8983/solr
        run: vendor/bin/phpunit --testsuite backend

  # Directory compliance. Blocking, per plan Appendix A item A17: WordPress.org
  # now runs automated security analysis on every release, so a finding here
  # stops a release rather than merely embarrassing us.
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Build the distributable
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          bash bin/build-release.sh

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/solrengine
