name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gates. Everything here must pass before the slower matrix runs, so a
  # missing docblock does not burn twenty minutes of matrix time.
  static:
    name: Standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Versions agree across header, constant and readme
        run: php bin/check-version.php

      # Generated from the docblocks above each hook, so it cannot drift from
      # them. This step also fails when a hook has no docblock, no @since, or
      # documents a different number of parameters than it passes — hooks are
      # public API from 1.0, and an undocumented one has no contract.
      - name: Hook reference is current and hooks are documented
        run: php bin/generate-hooks.php --check

      - name: Coding standards
        run: vendor/bin/phpcs --report=full

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Dependency vulnerabilities
        run: composer audit

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint:js

      - name: Build
        run: npm run build

      - name: Committed build output is current
        # assets/build is committed because WordPress.org ships a zip rather
        # than running a build. If a rebuild changes it, somebody edited the
        # source without rebuilding and the release would ship stale assets.
        run: git diff --exit-code -- assets/build

  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported range, per ADR-011.
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          composer-options: --ignore-platform-req=php+

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported combination.
          - php: '7.4'
            wordpress: '6.5'
          # Current.
          - php: '8.3'
            wordpress: 'latest'
          # Next, allowed to fail so a WordPress beta does not block a release.
          - php: '8.3'
            wordpress: 'trunk'
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          composer-options: --ignore-platform-req=php+

      - name: Install the WordPress test library
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wordpress }}

      - name: Integration tests
        env:
          SOLRENGINE_TEST_SUITE: integration
        run: vendor/bin/phpunit --testsuite integration

  # Solr-backed tests. Separate because they need a container and are the
  # slowest thing here. Both supported Solr lines are exercised: 10.x is the
  # recommended target, 9.10 the last supported 9.x. See ADR-011.
  backend:
    name: Backend (Solr ${{ matrix.solr }})
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        solr: ['9.10', '10']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Install the WordPress test library
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest

      # Started as a step rather than as a service container, because the core
      # has to exist before the suite runs and a service container cannot be
      # given a command. A stock Solr starts with no cores at all: against one,
      # every test in the suite skips, and a suite that skips silently looks
      # exactly like a suite that passed.
      - name: Start Solr with a collection
        run: |
          docker run -d --name solr -p 8983:8983 \
            solr:${{ matrix.solr }} solr-precreate wordpress

          for attempt in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8983/solr/wordpress/admin/ping" > /dev/null; then
              echo "Solr is up."
              exit 0
            fi
            sleep 2
          done

          echo "Solr did not become ready."
          docker logs solr
          exit 1

      - name: Backend tests
        env:
          SOLRENGINE_TEST_SUITE: backend
          SOLRENGINE_TEST_SOLR_URL: http://127.0.0.1:8983/solr
        run: vendor/bin/phpunit --testsuite backend

  # Directory compliance. Blocking, per plan Appendix A item A17: WordPress.org
  # now runs automated security analysis on every release, so a finding here
  # stops a release rather than merely embarrassing us.
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build the distributable
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci
          npm run build
          bash bin/build-release.sh

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/solrengine
          # One suppression, and the same position phpcs.xml.dist already takes
          # for this sniff: an exception message is logged, not rendered, and
          # escaping it mangles the message for whoever has to read it.
          #
          # The concrete case is Support/Container.php, which reports an unknown
          # or circular service id. That class loads no WordPress at all — the
          # unit suite fails if it ever needs to — so escaping there would make
          # the container depend on WordPress being loaded before it could
          # report a typo in a service name. Verified by trying it: two unit
          # tests went red immediately.
          #
          # Recorded rather than hidden: WordPress.org's own review runs the
          # unsuppressed check, and this is the answer if they ask.
          ignore-codes: WordPress.Security.EscapeOutput.ExceptionNotEscaped
